<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    #number{
        font-size: 8em;
        font-family: Arial, Helvetica, sans-serif;
        text-align: center;
    }
    #plus{
        width: 100px;
        height: 70px;
        background-color: aquamarine;
        margin-left: 45%;
        font-size: 5em;
    }
    #minus{
        width: 100px;
        height: 70px;
        background-color: aquamarine;
        font-size: 5em;
    }
    #reset{
        width: 100px;
        height: 70px;
        background-color: aquamarine;
        font-size: 2em;
    }
    </style>
</head>
<body>
    
    <p id="number">0</p>
    <button id="plus">+</button>
    <button id="minus">-</button>
    <button id="reset">Reset</button>
    <script src="script.js"></script>
</body>
</html>
